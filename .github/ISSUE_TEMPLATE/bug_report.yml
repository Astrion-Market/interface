name: Bug report
description: Something in the interface behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page
      placeholder: /review?market=…&action=lend
  - type: dropdown
    id: data
    attributes:
      label: Data source
      options:
        - Preview fixture / sample account
        - Stellar testnet (existing Soroban markets)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: For operations, attach the file from "Download diagnostics". Never paste secret keys or seed phrases.
