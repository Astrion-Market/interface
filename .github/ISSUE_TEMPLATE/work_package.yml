name: Work package
description: Scope a contribution from docs/ALPHA.md
labels: [work-package]
body:
  - type: input
    id: package
    attributes:
      label: Work package
      placeholder: Live market readers
    validations:
      required: true
  - type: textarea
    id: finish
    attributes:
      label: Finish line
      description: The observable result and the tests or evidence that prove it.
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Dependencies
      description: Contracts milestones (C-numbers) or interface work this needs first.
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence type
      multiple: true
      options:
        - Unit tests
        - Mocked browser journey
        - Protocol fork test
        - Testnet transaction
